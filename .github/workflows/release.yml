name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py --tag "$RELEASE_TAG" --check
      - name: Run checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          bash scripts/check.sh

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo '该版本已正式发布，不覆盖已有发布附件。'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/caddy-manager.tar.gz dist/install.sh dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md --draft=false --latest
